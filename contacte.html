<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
 <body>

<header>
  <h1>Contactez Kyara Export</h1>
</header>

<div class="container">

  <div class="contact-box">
    <p>Besoin d’aide ou d’information ? Contactez-nous directement :</p>
    <a class="whatsapp-button" href="https://wa.me/24268424624" target="_blank">Écrire sur WhatsApp</a>
  </div>

  <div class="tracking-box">
    <h2>Suivre votre colis</h2>
    <p>Entrez votre numéro de suivi :</p>
    <input type="text" id="trackingNumber" placeholder="Ex: KYARA123456">
    <br>
    <button class="track-btn" onclick="track()">Suivre</button>
    <div class="result" id="result"></div>
  </div>

</div>

<script>
  function track() {
    const num = document.getElementById("trackingNumber").value.trim();
 const result = document.getElementById("result");

    if (num === "") {
      result.innerText = "Veuillez entrer un numéro de suivi.";
      return;
    }

    // Simulation (à remplacer par une vraie API si besoin)
    result.innerText = "📦 Votre colis est en transit à Guangzhou - Chine.";
  }
</script>

</body>

   <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e3f2fd, #ffffff);
      color: #333;
    }

    header {
      background-color: #0d47a1;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      margin: 0;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .contact-box {
      text-align: center;
      margin-bottom: 40px;
    }

    .contact-box p {
      font-size: 1.1em;
    }

    .whatsapp-button {
      display: inline-block;
      background-color: #25D366;
      color: white;
      padding: 15px 25px;
      border-radius: 8px;
      font-size: 1em;
      text-decoration: none;
      transition: 0.3s;
    }

    .whatsapp-button:hover {
      background-color: #1ebd5a;
    }
 .tracking-box {
      text-align: center;
    }

    input[type="text"] {
      padding: 10px;
      width: 80%;
      max-width: 400px;
      font-size: 1em;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .track-btn {
      margin-top: 15px;
      background-color: #0d47a1;
      color: white;
      padding: 10px 20px;
      border: none;
      font-size: 1em;
      border-radius: 6px;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      font-style: italic;
      color: #00796b;
    }
  </style>
</html>
