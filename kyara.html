<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kyara export</title>
</head>
<body>
      <h1>Suivi de Colis</h1>
  <div class="tracker">
    <label for="trackingInput">Entrez votre numéro de suivi :</label>
    <input type="text" id="trackingInput" placeholder="Ex: KY001">
    <button onclick="trackParcel()">Vérifier</button>
    <div class="result" id="result"></div>
  </div>
</body>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      /* background: linear-gradient(to right, #1c1c1c, #2e2e2e); */
      background: url(./asset/f.jpg) center/cover;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px;
    }

    h1 {
      color: #ffcc00;
    }

    .tracker {
      background: #333;
      padding: 30px;
      border-radius: 10px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
    }

    input {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 5px;
      margin-top: 10px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      width: 100%;
      background-color: #ffcc00;
      color: #000;
      padding: 15px;
      border: none;
      font-weight: bold;
      font-size: 16px;border-radius: 5px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background-color: #e6b800;
    }

    .result {
      margin-top: 20px;
      font-size: 16px;
      background: #222;
      padding: 15px;
      border-radius: 5px;
    }                                                                           
  </style>

    <script>
    const colis = {
      "KY001": "📦 Colis arrive a l'entropot chine – Expédition dans 3jrs.",
      "KY002": "📍 Colis arrivé à Brazzaville – En cours de livraison.",
      "KY003": "✅ Colis livré le 8 Janvier.",
      "KY004": "🕓 Colis en attente de dédouanement.",
    };

    function trackParcel() {
      const input = document.getElementById("trackingInput").value.trim().toUpperCase();
      const resultBox = document.getElementById("result");

      if (colis[input]) {
        resultBox.innerHTML = colis[input];
      } else {
        resultBox.innerHTML = "❌ Numéro non reconnu. Veuillez vérifier ou nous contacter.";
      }
    }
  </script>
</html>
